services:
  - type: web
    name: dawa-track
    env: python
    region: oregon
    plan: free
    pythonVersion: 3.11.10
    buildCommand: pip install --only-binary :all: -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dawa-track-db
          property: connectionString
      - key: SECRET_KEY
        sync: false

databases:
  - name: dawa-track-db
    plan: free
